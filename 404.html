<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحه پیدا نشد | پک کرفت</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080d17">
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080d17;color:#e8eef7;font-family:Vazirmatn,Vazir,Tahoma,'Segoe UI',sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.wrap{max-width:520px}
h1{font-size:72px;margin:0 0 8px;background:linear-gradient(135deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
h2{font-size:22px;margin:0 0 12px;font-weight:700}
p{color:#9fb0c7;line-height:1.9;margin:0 0 28px;font-size:15px}
a.btn{display:inline-block;padding:12px 32px;border-radius:14px;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:#fff;text-decoration:none;font-weight:700;transition:transform .2s}
a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<main class="wrap">
<h1>۴۰۴</h1>
<h2>این صفحه پیدا نشد!</h2>
<p>به نظر می‌رسد آدرسی که دنبالش بودی در دنیای پک کرفت وجود ندارد.<br>ولی نگران نباش — همه ریسورس پک‌ها، مودها و شیدرهای ماینکرفت هنوز همین‌جان!</p>
<a class="btn" href="/">بازگشت به صفحه اصلی 🏠</a>
</main>
</body>
</html>

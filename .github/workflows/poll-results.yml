name: Update poll results JSON

# Reads the published Google Sheet CSV of poll responses, counts each option
# and commits poll-results.json so the numeric results are versioned in the repo.
# Skips itself until the CSV URL is filled in below (after the form is set up).

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-results
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect votes and build poll-results.json
        env:
          POLL_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTS_R6k8H59kP-eJcNcKBES1GuXnRb6u_BOLWDlMtM_TmnnGRlzecGOtz3_gqtgEjiGAd04MP5pDLLB/pub?output=csv"
          POLL_LABEL_BEDROCK: "بدراک"
          POLL_LABEL_JAVA: "جاوا"
        run: |
          node -e "
          const fs = require('node:fs');
          const url = (process.env.POLL_CSV_URL || '').trim();
          if (!url || url.includes('PASTE-')) {
            console.log('Poll CSV URL is not configured yet — skipping.');
            process.exit(0);
          }
          const bedrockLabel = process.env.POLL_LABEL_BEDROCK;
          const javaLabel = process.env.POLL_LABEL_JAVA;
          fetch(url, { cache: 'no-store' })
            .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then((csv) => {
              const rows = csv.trim().split(/\r?\n/);
              let bedrock = 0;
              let java = 0;
              for (let i = 1; i < rows.length; i++) {
                if (rows[i].includes(bedrockLabel)) bedrock += 1;
                else if (rows[i].includes(javaLabel)) java += 1;
              }
              const total = bedrock + java;
              const out = {
                question: 'bedrock-vs-java',
                bedrock: bedrock,
                java: java,
                total: total,
                updatedAt: new Date().toISOString()
              };
              fs.writeFileSync('poll-results.json', JSON.stringify(out, null, 2) + '\n');
              console.log('poll-results.json:', out);
            })
            .catch((e) => { console.error(e.message); process.exit(1); });
          "

      - name: Commit and push if changed
        run: |
          git config user.name "packcraft-bot"
          git config user.email "bot@packcraft.ir"
          git add poll-results.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "بروزرسانی خودکار نتایج نظرسنجی"
            git pull --rebase origin main || git pull --rebase origin main
            git push
          fi
